; E5 CAN node firmware: one code base, two boards, MCP2515 + TJA1050 over SPI.
; MCP_OSC must match the crystal printed on YOUR MCP2515 module (8 or 16 MHz).
; A wrong value gives a wrong bitrate and a bus full of error frames.

[env]
framework = arduino
lib_deps = autowp/autowp-mcp2515@^1.2.1
monitor_speed = 115200

[env:nucleo_l476rg]
platform = ststm32
board = nucleo_l476rg
; MCP2515 on Arduino header: SCK D13, MISO D12, MOSI D11, CS D10
build_flags = -DMCP_CS_PIN=D10 -DMCP_OSC=MCP_8MHZ -DNODE_BOARD=\"nucleo_l476rg\"

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
; default FSPI pins on S3: SCK 12, MISO 13, MOSI 11, CS 10 (check your board's pinout)
build_flags = -DMCP_CS_PIN=10 -DMCP_OSC=MCP_8MHZ -DNODE_BOARD=\"esp32s3\" -DARDUINO_USB_CDC_ON_BOOT=1
